<template>
    <div class="bell">
        <button
            class="bell__button"
            type="button"
            lwc:ref="button"
            aria-haspopup="dialog"
            aria-expanded={ariaExpanded}
            aria-label={buttonLabel}
            onclick={toggle}
        >
            <svg class="bell__icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                <path d="M12 3a6 6 0 0 0-6 6v3.6L4.2 16a1 1 0 0 0 .9 1.5h13.8a1 1 0 0 0 .9-1.5L18 12.6V9a6 6 0 0 0-6-6zm-2.2 16a2.2 2.2 0 0 0 4.4 0z" fill="currentColor" />
            </svg>
            <template lwc:if={hasUnread}>
                <span class="bell__badge" aria-hidden="true">{badgeText}</span>
            </template>
        </button>
        <template lwc:if={isOpen}>
            <c-nimbus-notification-tray
                items={items}
                has-more={hasMore}
                is-loading={isLoading}
                has-error={hasError}
                has-unread={hasUnread}
                onselect={handleItemSelect}
                onmarkallread={handleMarkAllRead}
                onloadmore={handleLoadMore}
                onretry={loadFirstPage}
                onclose={close}
            ></c-nimbus-notification-tray>
        </template>
    </div>
</template>
